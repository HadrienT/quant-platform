# Where notifications go: an ntfy topic (ADR-017). docker-compose.yml builds
# ALERT_WEBHOOK_URL from NTFY_URL (.env, never in git) by appending
# `?template=grafana&priority=4&tags=rotating_light`: ntfy's built-in `grafana`
# template turns Grafana's webhook JSON into a readable push (title prefixed 🚨 when
# firing, ✅ when resolved; body = the `message` below).
#
# No `$` in the templates below: Grafana expands `$NAME` in provisioning files as an
# environment variable.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: quant-platform
    receivers:
      - uid: qp-webhook
        type: webhook
        settings:
          url: ${ALERT_WEBHOOK_URL}
          httpMethod: POST
          # Short push body: one "summary / description" pair per alert. Grafana's
          # default message lists every label, value and localhost link, which is
          # noise on a phone. Annotations carry counts only, no personal data.
          message: |-
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ .Annotations.description }}

            {{ end }}
