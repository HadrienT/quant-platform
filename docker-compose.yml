# quant-platform — event bus, audit trail and observability.
#
# Nothing here is published outside 127.0.0.1. Kafka and the audit database are
# reachable only through the external `dataplatform` network, by container name.
# Services are added lot by lot (see blueprint/README.md).
#
# Networks: `dataplatform` (external, shared with the other projects) carries only
# what other projects must reach (kafka, later qm-audit and the OTel collector).
# Everything else stays on this project's private `default` network.
name: quant-platform

# Every container logs as JSON files rotated at 3 x 10 MB, and copies its compose
# service name into each line: that is how the OTel collector labels logs in Loki
# (WP 03). Other projects joining the platform set the same option.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
    labels: com.docker.compose.service

x-topics-env: &kafka-tools-env
  # Kafka CLI tools default to a heap sized from the machine's RAM.
  KAFKA_HEAP_OPTS: -Xmx128m -Xms32m

services:
  # ── WP 01 ── Kafka (single KRaft node: broker + controller, no ZooKeeper) ────
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    environment:
      # The image reads CLUSTER_ID (not KAFKA_CLUSTER_ID) to format the log dir.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?run scripts/init_env.sh}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners: a container reaches the broker as kafka:9092; a
      # client on the host reaches it as 127.0.0.1:9094. A broker tells clients
      # the address to reconnect to (advertised listener), and that address must
      # be resolvable FROM THE CLIENT — hence one listener per vantage point.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${QP_KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Topics are code (topics/topics.yml): a producer with a typo must fail, not
      # silently create a ghost topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # One broker, so replication factor 1: NO high availability (ADR-008).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Without a cap the JVM takes a fraction of the shared machine's RAM.
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512m -Xms512m}
    ports:
      - "127.0.0.1:${QP_KAFKA_PORT:-9094}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - default
      - dataplatform
    healthcheck:
      # The check spawns its own JVM inside the 1 GiB limit: give it a tiny heap.
      test:
        - CMD-SHELL
        - >-
          KAFKA_HEAP_OPTS='-Xmx64m -Xms32m'
          /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 20s

  # One-shot: aligns the broker with topics/topics.yml (idempotent), then exits.
  topics-init:
    image: apache/kafka:4.1.1
    container_name: qp-topics-init
    logging: *default-logging
    restart: "no"
    mem_limit: 384m
    cpus: 1
    entrypoint: ["/bin/bash", "/opt/topics/topics.sh"]
    environment:
      <<: *kafka-tools-env
      BOOTSTRAP: kafka:9092
      TOPICS_FILE: /opt/topics/topics.yml
    volumes:
      - ./scripts/topics.sh:/opt/topics/topics.sh:ro
      - ./topics/topics.yml:/opt/topics/topics.yml:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - default

  # Console to look inside Kafka: topics, messages, consumer groups, lag.
  akhq:
    image: tchiotludo/akhq:0.26.0
    container_name: akhq
    logging: *default-logging
    labels:
      # Changes when a mounted config file changes, so compose recreates the service (scripts/config_hash.sh).
      qp.config-hash: ${QP_HASH_AKHQ:-}
    restart: unless-stopped
    mem_limit: 320m
    cpus: 1
    environment:
      MICRONAUT_CONFIG_FILES: /app/config/application.yml
      JAVA_OPTS: -Xmx128m -Xms64m
    ports:
      - "127.0.0.1:${QP_AKHQ_PORT:-8181}:8080"
    volumes:
      - ./akhq/application.yml:/app/config/application.yml:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:28081/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── WP 02 ── Audit database (append-only) ────────────────────────────────────
  # Distinct from data-ingest's Postgres (ADR-003). Reachable on `dataplatform`
  # (the API's replay endpoint reads it as audit_reader) and on 127.0.0.1 for debugging.
  qm-audit:
    image: postgres:17.6
    container_name: qm-audit
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    shm_size: 64m
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=40
    environment:
      POSTGRES_USER: qm_admin
      POSTGRES_PASSWORD: ${AUDIT_DB_ADMIN_PASSWORD:?run scripts/init_env.sh}
      POSTGRES_DB: qm_audit
      AUDIT_DB_OWNER_PASSWORD: ${AUDIT_DB_OWNER_PASSWORD:?}
      AUDIT_DB_WRITER_PASSWORD: ${AUDIT_DB_WRITER_PASSWORD:?}
      AUDIT_DB_READER_PASSWORD: ${AUDIT_DB_READER_PASSWORD:?}
    ports:
      - "127.0.0.1:${QP_AUDIT_DB_PORT:-5434}:5432"
    volumes:
      - qm-audit-data:/var/lib/postgresql/data
      - ./qm-audit/init:/docker-entrypoint-initdb.d:ro
    networks:
      - default
      - dataplatform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qm_admin -d qm_audit"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # One-shot: applies migrations/*.sql (recorded with a checksum) and creates the
  # monthly partitions. `docker compose run --rm audit-migrate maintain` also drops
  # the partitions past retention (the systemd maintenance timer does this).
  audit-migrate:
    image: postgres:17.6
    container_name: qp-audit-migrate
    logging: *default-logging
    restart: "no"
    mem_limit: 128m
    cpus: 0.5
    entrypoint: ["/bin/bash", "/opt/migrate/migrate.sh"]
    environment:
      PGHOST: qm-audit
      PGDATABASE: qm_audit
      PGUSER: audit_owner
      PGPASSWORD: ${AUDIT_DB_OWNER_PASSWORD:?}
      RETENTION_MONTHS: ${AUDIT_RETENTION_MONTHS:-12}
      DRY_RUN: ${AUDIT_DRY_RUN:-0}
    volumes:
      - ./scripts/migrate.sh:/opt/migrate/migrate.sh:ro
      - ./migrations:/opt/migrate/migrations:ro
    depends_on:
      qm-audit:
        condition: service_healthy
    networks:
      - default

  # The only writer of the audit database (audit_writer: INSERT only). Consumes the
  # audit topics in group `audit-sink`; commits offsets AFTER the database commit.
  audit-sink:
    build:
      context: .
      dockerfile: sink/Dockerfile
    image: quant-platform/audit-sink:${COMMIT_SHA:-dev}
    container_name: audit-sink
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    # SIGTERM: finish the batch, commit, leave the group cleanly.
    stop_grace_period: 30s
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      PGHOST: qm-audit
      PGDATABASE: qm_audit
      PGUSER: audit_writer
      PGPASSWORD: ${AUDIT_DB_WRITER_PASSWORD:?}
      SINK_BATCH_SIZE: ${SINK_BATCH_SIZE:-500}
      # Avro messages resolve their schema here; JSON messages never need it.
      SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
      SINK_DEBUG_DELAY_MS: ${SINK_DEBUG_DELAY_MS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully
      audit-migrate:
        condition: service_completed_successfully
    networks:
      - default
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:9108/metrics", timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── WP 05 ── Schema registry (Apicurio, Confluent-compatible API) ─────────────
  # Producers register their Avro schema here; consumers read it by id. Its state
  # lives in Kafka topics (KafkaSQL: kafkasql-journal, never expiring — declared in
  # topics/topics.yml), so it needs no database of its own (ADR-014). No authentication:
  # reachable only on dataplatform and 127.0.0.1.
  schema-registry:
    image: apicurio/apicurio-registry:3.1.2
    container_name: schema-registry
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS_APPEND: -Xmx320m
    ports:
      - "127.0.0.1:${QP_REGISTRY_PORT:-8082}:8080"
    depends_on:
      kafka:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully
    networks:
      - default
      - dataplatform
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # One-shot: global compatibility = BACKWARD (idempotent), on every `up`.
  registry-init:
    image: apicurio/apicurio-registry:3.1.2
    container_name: qp-registry-init
    logging: *default-logging
    restart: "no"
    mem_limit: 64m
    cpus: 0.25
    entrypoint: ["/bin/bash", "/opt/registry/registry_init.sh"]
    environment:
      REGISTRY_URL: http://schema-registry:8080
    volumes:
      - ./scripts/registry_init.sh:/opt/registry/registry_init.sh:ro
    depends_on:
      schema-registry:
        condition: service_healthy
    networks:
      - default

  # ── WP 04 ── Data quality: a SECOND, independent consumer group ───────────────
  # Reads the same topics as the audit sink without any coordination with it: each
  # group has its own offsets, so stopping one never affects the other.
  data-quality:
    build:
      context: .
      dockerfile: data_quality/Dockerfile
    image: quant-platform/data-quality:${COMMIT_SHA:-dev}
    container_name: data-quality
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    stop_grace_period: 30s
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DQ_BATCH_SIZE: ${DQ_BATCH_SIZE:-500}
      SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
      DQ_DEBUG_DELAY_MS: ${DQ_DEBUG_DELAY_MS:-0}
      DQ_LOG_EVENTS: ${DQ_LOG_EVENTS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully
    networks:
      - default
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:9109/metrics", timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── WP 03 ── Telemetry (the OTLP path; Kafka is not involved: ADR-004) ────────
  # The seam applications talk to. On `dataplatform` so the API reaches it as
  # otel-collector:4317. Runs as root ONLY to read Docker's json logs, mounted
  # read-only (no docker.sock is ever mounted).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    container_name: otel-collector
    logging: *default-logging
    labels:
      # Changes when a mounted config file changes, so compose recreates the service (scripts/config_hash.sh).
      qp.config-hash: ${QP_HASH_OTEL:-}
    restart: unless-stopped
    user: "0:0"
    mem_limit: 128m
    cpus: 0.5
    command: ["--config=/etc/otelcol/collector.yml"]
    environment:
      GOMEMLIMIT: 100MiB
    ports:
      - "127.0.0.1:${QP_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./otel/collector.yml:/etc/otelcol/collector.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otel-state:/var/lib/otelcol
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - default
      - dataplatform

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: prometheus
    logging: *default-logging
    labels:
      # Changes when a mounted config file changes, so compose recreates the service (scripts/config_hash.sh).
      qp.config-hash: ${QP_HASH_PROMETHEUS:-}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    environment:
      GOMEMLIMIT: 400MiB
    ports:
      - "127.0.0.1:${QP_PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  loki:
    image: grafana/loki:3.5.5
    container_name: loki
    logging: *default-logging
    labels:
      # Changes when a mounted config file changes, so compose recreates the service (scripts/config_hash.sh).
      qp.config-hash: ${QP_HASH_LOKI:-}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    command: ["-config.file=/etc/loki/config.yml"]
    environment:
      GOMEMLIMIT: 400MiB
    ports:
      - "127.0.0.1:${QP_LOKI_PORT:-3101}:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  tempo:
    image: grafana/tempo:2.8.2
    container_name: tempo
    logging: *default-logging
    labels:
      # Changes when a mounted config file changes, so compose recreates the service (scripts/config_hash.sh).
      qp.config-hash: ${QP_HASH_TEMPO:-}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1
    command: ["-config.file=/etc/tempo/config.yml"]
    environment:
      GOMEMLIMIT: 300MiB
    volumes:
      - ./tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    networks:
      - default

  # Consumer lag per group and throughput per topic, read from the broker's API
  # (chosen over JMX: no JVM agent to add to the broker — ADR-012).
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    command:
      - --kafka.server=kafka:9092
      - --topic.filter=^qm\.
      - --web.listen-address=:9308
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - default

  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana
    logging: *default-logging
    labels:
      # Changes when a mounted config file changes, so compose recreates the service (scripts/config_hash.sh).
      qp.config-hash: ${QP_HASH_GRAFANA:-}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run scripts/init_env.sh}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GOMEMLIMIT: 200MiB
      # Read by the datasource provisioning file (never written in git).
      AUDIT_DB_READER_PASSWORD: ${AUDIT_DB_READER_PASSWORD:?}
      # Where alert notifications go (contact point `quant-platform` in alerts/). Empty
      # until a channel is chosen: alerts then fire in Grafana but notify nobody.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://alert-channel-not-configured.invalid/}
    ports:
      - "127.0.0.1:${QP_GRAFANA_PORT:-3100}:3000"
    volumes:
      # One mount per provisioning kind: a mount inside a read-only mount cannot be created.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./alerts:/etc/grafana/provisioning/alerting:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      qm-audit:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  kafka-data:
  qm-audit-data:
  otel-state:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  dataplatform:
    external: true
