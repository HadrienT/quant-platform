# Loki, single binary, filesystem storage. Retention 30 days: this is where the
# CLEAR-TEXT IP of access logs lives (ADR-009), so it must expire.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h
  # Everything that is not a label is structured metadata (OTLP attributes): high
  # cardinality values live there, never in the index.
  allow_structured_metadata: true
  max_label_names_per_series: 15
  max_global_streams_per_user: 5000
  ingestion_rate_mb: 8

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
